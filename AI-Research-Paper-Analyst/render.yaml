# Render Blueprint: New -> Blueprint -> select this repo. Verify plan names in the Render dashboard.
databases:
  - name: research-db
    plan: basic-256mb
    databaseName: research
services:
  - type: web
    name: research-paper-analyst-api
    runtime: python
    rootDir: backend
    plan: starter            # BGE-small + torch need > 512 MB RAM; the free plan is too small
    buildCommand: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - {key: PYTHON_VERSION, value: 3.11.9}
      - {key: APP_ENV, value: production}
      - {key: DATABASE_URL, fromDatabase: {name: research-db, property: connectionString}}
      - {key: FRONTEND_URL, sync: false}
      - {key: CORS_ORIGIN_REGEX, value: 'https://.*\.vercel\.app'}
      - {key: LLM_API_KEY, sync: false}
      - {key: LLM_MODEL, sync: false}
      - {key: LLM_BASE_URL, sync: false}
      - {key: EMBEDDING_MODEL, value: BAAI/bge-small-en-v1.5}
      - {key: STORAGE_BACKEND, value: s3}
      - {key: S3_BUCKET, sync: false}
      - {key: S3_ENDPOINT_URL, sync: false}
      - {key: S3_REGION, value: auto}
      - {key: S3_ACCESS_KEY_ID, sync: false}
      - {key: S3_SECRET_ACCESS_KEY, sync: false}
